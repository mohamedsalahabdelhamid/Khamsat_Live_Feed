services:
  khamsat-scraper:
    build: .
    container_name: khamsat_pro_v2
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - khamsat_logs:/app/logs
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - PORT=8080
      - SCRAPE_INTERVAL=120
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  khamsat_logs:

networks:
  default:
    name: khamsat_network
